name: Site assets

on:
  pull_request:
  push:
    branches: [main, research-rework]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install asset dependencies
        run: |
          python -m pip install -r requirements-assets.txt pytest==9.0.2
          python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated assets
        run: make assets-check

      - name: Test asset contracts and punctuation
        run: python -m pytest tests/test_assets.py tests/test_asset_drift.py tests/test_no_em_dash.py -q

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
