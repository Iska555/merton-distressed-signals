[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merton-credit-study"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "python-dotenv",
]

[project.optional-dependencies]
assets = [
    "Pillow",
    "playwright",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
